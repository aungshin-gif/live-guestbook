
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aung's Artisan Cafe & Eatery</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }
    
    /* Header / Navbar */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-weight: 700; font-size: 20px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .nav-actions { display: flex; gap: 12px; align-items: center; }
    
    button {
      cursor: pointer; border: none; border-radius: 8px; font-weight: 600;
      padding: 8px 16px; transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--border); }
    
    /* Container */
    .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    
    /* Views switcher */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Product Grid */
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px; margin-top: 20px;
    }
    .product-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: space-between;
    }
    .product-icon { font-size: 54px; margin-bottom: 12px; }
    .product-name { font-size: 17px; font-weight: 600; }
    .product-price { font-size: 18px; color: var(--accent); font-weight: 700; margin: 10px 0; }
    .discount-badge { background: #ef4444; color: white; font-size: 11px; padding: 2px 8px; border-radius: 12px; margin-left: 6px; }

    /* Cart Sidebar / Drawer */
    .cart-drawer {
      position: fixed; top: 0; right: -400px; width: 350px; height: 100vh;
      background: var(--card-bg); border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5); padding: 24px; transition: right 0.3s;
      z-index: 200; display: flex; flex-direction: column;
    }
    .cart-drawer.open { right: 0; }
    .cart-items { flex: 1; overflow-y: auto; margin: 20px 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    
    /* Modals (Auth) */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 300;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      width: 100%; max-width: 380px; padding: 28px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 10px; border-radius: 8px; background: var(--bg);
      border: 1px solid var(--border); color: white;
    }

    /* History Table */
    .history-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo" onclick="switchView('shop')">☕ Aung's Cafe</div>
    <div class="nav-actions">
      <button class="btn-outline" onclick="switchView('history')">📜 History</button>
      <button class="btn-primary" onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
      <div id="authActions">
        <button class="btn-outline" onclick="openAuthModal('login')">🔑 Login</button>
      </div>
    </div>
  </nav>

  <div class="container">
    
    <!-- SHOP VIEW -->
    <div id="shopView" class="view-section active">
      <h2 style="margin-bottom: 6px;">Menu Items</h2>
      <p style="color: var(--text-muted); font-size: 14px;">Select items and order freshly prepared meals.</p>
      
      <div class="product-grid" id="productList"></div>
    </div>

    <!-- ORDER HISTORY VIEW -->
    <div id="historyView" class="view-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Your Order History</h2>
        <button class="btn-outline" onclick="switchView('shop')">← Back to Menu</button>
      </div>
      <div id="historyList">Loading history...</div>
    </div>

  </div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Your Cart</h3>
      <button class="btn-outline" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems">No items in cart</div>
    <div>
      <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 15px;">
        <span>Total:</span>
        <span id="cartTotal" style="color: var(--accent);">$0.00</span>
      </div>
      <button class="btn-primary" style="width: 100%; padding: 12px;" onclick="checkout()">🚀 Checkout Order</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="modalTitle">Account Login</h3>
        <button class="btn-outline" onclick="closeAuthModal()">✕</button>
      </div>
      
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="authEmail" placeholder="you@example.com">
      </div>
      <div class="form-group" id="pwdGroup">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••">
      </div>

      <button class="btn-primary" style="width:100%; padding: 12px; margin-top: 8px;" id="authSubmitBtn" onclick="handleAuthSubmit()">Login</button>
      
      <div style="text-align: center; margin-top: 14px; font-size: 13px; color: var(--text-muted);">
        <span id="authSwitchText">Don't have an account? <a href="#" onclick="openAuthModal('signup')" style="color: var(--accent);">Sign Up</a></span>
        <br><br>
        <a href="#" onclick="openAuthModal('reset')" style="color: #60a5fa; font-size: 12px;">Forgot Password?</a>
      </div>
      <div id="authStatus" style="font-size: 13px; text-align: center; margin-top: 10px;"></div>
    </div>
  </div>

  <!-- Supabase Script Logic -->
  <script>
    const SUPABASE_URL = "https://gsmdkjorqeqwkkhuuqcc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OXvm6VqHDKwifXFxFdtTjA_fOkAXM6r";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Products Data
    const products = [
      { id: 1, name: "Japanese Rice", price: 10.0, icon: "🍚", discount: false },
      { id: 2, name: "German Bread", price: 5.0, icon: "🍞", discount: false },
      { id: 3, name: "Coffee Hot", price: 2.0, icon: "☕", discount: false },
      { id: 4, name: "Burger Swiss", price: 1.3, icon: "🍔", discount: true },
      { id: 5, name: "Potatoes Chips", price: 2.0, icon: "🍟", discount: false }
    ];

    let cart = [];
    let currentUser = null;
    let authMode = 'login'; // 'login', 'signup', 'reset'

    // Init App
    window.addEventListener('DOMContentLoaded', async () => {
      renderProducts();
      await checkAuthUser();
    });

    function renderProducts() {
      const grid = document.getElementById('productList');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-icon">${p.icon}</div>
          <div class="product-name">${p.name} ${p.discount ? '<span class="discount-badge">Special $1.3</span>' : ''}</div>
          <div class="product-price">$${p.price.toFixed(2)}</div>
          <button class="btn-primary" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
      `).join('');
    }

    // Cart Logic
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cartCount').innerText = count;
      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;

      const cartList = document.getElementById('cartItems');
      if (cart.length === 0) {
        cartList.innerHTML = '<p style="color:gray; text-align:center;">Cart is empty</p>';
      } else {
        cartList.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong> x ${item.qty}
              <div style="color:var(--text-muted); font-size:12px;">$${(item.price * item.qty).toFixed(2)}</div>
            </div>
            <button class="btn-outline" style="padding:2px 8px; font-size:12px;" onclick="removeFromCart(${item.id})">✕</button>
          </div>
        `).join('');
      }
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    // Checkout Logic
    async function checkout() {
      if (cart.length === 0) return alert("Your cart is empty!");
      if (!currentUser) {
        alert("Please login first to place an order!");
        openAuthModal('login');
        return;
      }

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const { data, error } = await _supabase.from('orders').insert([{
        user_email: currentUser.email,
        items: cart,
        total_amount: total
      }]);

      if (error) {
        alert("Checkout error: " + error.message);
      } else {
        alert("🎉 Order placed successfully!");
        cart = [];
        updateCartUI();
        toggleCart();
        switchView('history');
      }
    }

    // View Switching
    function switchView(view) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      if (view === 'shop') {
        document.getElementById('shopView').classList.add('active');
      } else if (view === 'history') {
        document.getElementById('historyView').classList.add('active');
        loadOrderHistory();
      }
    }

    async function loadOrderHistory() {
      const historyList = document.getElementById('historyList');
      if (!currentUser) {
        historyList.innerHTML = '<p style="color:gray;">Please login to view your order history.</p>';
        return;
      }

      historyList.innerHTML = 'Loading orders...';
      const { data, error } = await _supabase
        .from('orders')
        .select('*')
        .eq('user_email', currentUser.email)
        .order('id', { ascending: false });

      if (error) {
        historyList.innerHTML = '<span style="color:red;">Error loading history</span>';
      } else if (!data || data.length === 0) {
        historyList.innerHTML = '<p style="color:gray;">No previous orders found.</p>';
      } else {
        historyList.innerHTML = data.map(order => `
          <div class="history-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <strong>Order #${order.id}</strong>
              <span style="color:var(--accent); font-weight:700;">$${parseFloat(order.total_amount).toFixed(2)}</span>
            </div>
            <div style="font-size:13px; color:var(--text-muted);">
              ${order.items.map(i => `${i.name} (${i.qty}x)`).join(', ')}
            </div>
            <div style="font-size:11px; color:#64748b; margin-top:6px;">
              ${new Date(order.created_at).toLocaleString()}
            </div>
          </div>
        `).join('');
      }
    }

    // Auth (Login / Signup / Forgot Password)
    async function checkAuthUser() {
      const { data: { user } } = await _supabase.auth.getUser();
      currentUser = user;
      updateAuthUI();
    }

    function updateAuthUI() {
      const authDiv = document.getElementById('authActions');
      if (currentUser) {
        authDiv.innerHTML = `
          <span style="font-size:13px; color:var(--accent);">👤 ${currentUser.email.split('@')[0]}</span>
          <button class="btn-outline" onclick="handleLogout()">Logout</button>
        `;
      } else {
        authDiv.innerHTML = `<button class="btn-outline" onclick="openAuthModal('login')">🔑 Login</button>`;
      }
    }

    function openAuthModal(mode) {
      authMode = mode;
      document.getElementById('authModal').classList.add('active');
      document.getElementById('authStatus').innerText = '';
      const title = document.getElementById('modalTitle');
      const btn = document.getElementById('authSubmitBtn');
      const pwdGroup = document.getElementById('pwdGroup');
      const switchText = document.getElementById('authSwitchText');

      if (mode === 'login') {
        title.innerText = 'Account Login';
        btn.innerText = 'Login';
        pwdGroup.style.display = 'block';
        switchText.innerHTML = `Don't have an account? <a href="#" onclick="openAuthModal('signup')" style="color:var(--accent);">Sign Up</a>`;
      } else if (mode === 'signup') {
        title.innerText = 'Create Account';
        btn.innerText = 'Sign Up';
        pwdGroup.style.display = 'block';
        switchText.innerHTML = `Already have an account? <a href="#" onclick="openAuthModal('login')" style="color:var(--accent);">Login</a>`;
      } else if (mode === 'reset') {
        title.innerText = 'Reset Password';
        btn.innerText = 'Send Reset Email';
        pwdGroup.style.display = 'none';
        switchText.innerHTML = `<a href="#" onclick="openAuthModal('login')" style="color:var(--accent);">Back to Login</a>`;
      }
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.remove('active');
    }

    async function handleAuthSubmit() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const status = document.getElementById('authStatus');

      if (!email) return alert("Please enter email");

      status.innerText = "Processing...";
      status.style.color = "var(--text-muted)";

      if (authMode === 'signup') {
        const { data, error } = await _supabase.auth.signUp({ email, password });
        if (error) {
          status.innerText = error.message;
          status.style.color = "red";
        } else {
          status.innerText = "✅ Account created! You can login now.";
          status.style.color = "var(--success)";
          setTimeout(() => openAuthModal('login'), 1500);
        }
      } else if (authMode === 'login') {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
          status.innerText = error.message;
          status.style.color = "red";
        } else {
          currentUser = data.user;
          updateAuthUI();
          closeAuthModal();
        }
      } else if (authMode === 'reset') {
        const { error } = await _supabase.auth.resetPasswordForEmail(email);
        if (error) {
          status.innerText = error.message;
          status.style.color = "red";
        } else {
          status.innerText = "📩 Password reset link sent to your email!";
          status.style.color = "var(--success)";
        }
      }
    }

    async function handleLogout() {
      await _supabase.auth.signOut();
      currentUser = null;
      updateAuthUI();
      switchView('shop');
    }
  </script>
</body>
</html>
